<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝총회 참석자 명부제출</title>
  <!-- Bootstrap CSS (CDN) -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    .input-group-text {
      width: 90px;
    }
    /* 서명 캔버스 스타일 */
    #signaturePad {
      border: 2px solid #000;
      width: 100%;
      height: 150px;
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h3 class="mb-4">📝총회 참석자 명부</h3>
    <span>📢아래에 사번, 성명, 연락처, 서명을 입력 후 제출해 주세요</span>
    <br><br>
    <form id="attendeeForm">
      <!-- 사번 입력 그룹 -->
      <div class="form-group">
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text" id="employeeIdLabel">🔢사번</span>
          </div>
          <input type="number" class="form-control" id="employeeId" name="employeeId" aria-label="사번" aria-describedby="employeeIdLabel" required>
        </div>
      </div>
    
      <!-- 이름 입력 그룹 -->
      <div class="form-group">
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text" id="nameLabel">🤵성명</span>
          </div>
          <input type="text" class="form-control" id="name" name="name" aria-label="이름" aria-describedby="nameLabel" required>
        </div>
      </div>
    
      <!-- 연락처 입력 그룹 -->
      <div class="form-group">
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text" id="contactLabel">☎연락처</span>
          </div>
          <input type="tel" class="form-control" id="contact" name="contact" placeholder="숫자만" aria-label="연락처" aria-describedby="contactLabel" required>
        </div>
      </div>
      
      <!-- 서명 입력 그룹 -->
      <div class="form-group" style="position: relative; display: inline-block;">
        <label for="signaturePad">✍개인정보 제공에 동의하며 아래에 서명합니다.</label>
        <!-- 캔버스: 원하는 스타일로 조정 -->
        <canvas id="signaturePad" style="border: 0.5px solid #383535; width:100% display: block;"></canvas>
        <!-- 우측 상단에 위치한 이모티콘 버튼 -->
        <button 
          type="button" 
          id="clearSignature" 
          style="position: absolute; top: 35px; right: -2px; background: transparent; border: none; font-size: 1.5em; cursor: pointer;"
          title="서명 지우기">
          🔄
        </button>
      </div>
      <div id="result" class="mt-3"></div>
      <!-- 제출 버튼 -->
      <button type="submit" id="submitBtn" class="btn btn-primary btn-block">📤제출하기</button>
    </form>    
  </div>

  <!-- Signature Pad 라이브러리 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <!-- JavaScript -->
  <script>
// 1. SignaturePad 초기화 및 캔버스 사이즈 보정
var canvas = document.getElementById("signaturePad");
var signaturePad = new SignaturePad(canvas);

function resizeCanvas() {
  var ratio = Math.max(window.devicePixelRatio || 1, 1);
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  canvas.getContext("2d").scale(ratio, ratio);
  signaturePad.clear(); // clear 후 isEmpty()가 제대로 동작하도록
}
window.onresize = resizeCanvas;
resizeCanvas();

// 서명 지우기 버튼 클릭 시
document.getElementById("clearSignature").addEventListener("click", function() {
  signaturePad.clear();
});

// 2. 폼 제출 이벤트 처리
document.getElementById("attendeeForm").addEventListener("submit", function(e) {
  e.preventDefault();  // 페이지 새로고침 방지

  // **서명 필수 체크**
  if (signaturePad.isEmpty()) {
    alert("⚠서명은 필수 입력값입니다. 서명해 주세요.");
    return; // 서명이 없으면 제출 중단
  }
  
  // 입력값 가져오기
  var employeeId = document.getElementById("employeeId").value;
  var name = document.getElementById("name").value;
  var contact = document.getElementById("contact").value;
  var signatureData = signaturePad.toDataURL();  // 서명이 존재하므로 바로 데이터 URL 추출

  // 확인 메시지 구성
  var confirmMessage = "다음 내용으로 제출하시겠습니까?\n\n" +
                       "사번: " + employeeId + "\n" +
                       "성명: " + name + "\n" +
                       "연락처: " + contact + "\n" +
                       "서명: 첨부됨";
  
  if (!confirm(confirmMessage)) {
    return;
  }
  
  // 제출 버튼 비활성화 및 텍스트 변경
  var submitButton = document.querySelector('button[type="submit"]');
  submitButton.disabled = true;
  submitButton.textContent = "📤제출중...잠시만 기다려 주세요";
  
  alert("🤷‍♂️제출중입니다. 잠시만 기다려 주세요");
  
  // 전송할 데이터 객체 (키는 한글로 사용)
  var data = {
    사번: employeeId,
    이름: name,
    연락처: contact,
    서명: signatureData
  };
  
  // Google Apps Script 웹 앱 URL (정확한 URL 사용)
  var scriptURL = "https://script.google.com/macros/s/AKfycbwH2VL2C0x2nWP6Kqv3j1CuRCEPrt4aMQ8i7RtfGEhGYNZcWSB54zi7jZ3lhMAivfkt/exec";
  
  fetch(scriptURL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(data)
  })
  .then(() => {
    document.getElementById("result").innerHTML =
      '<div class="alert alert-success">🚀성공적으로 제출 되었습니다.</div>';
    document.getElementById("attendeeForm").reset();
    signaturePad.clear();  // 서명 캔버스도 초기화
    document.getElementById("submitBtn").style.display="none";
    // 3초 후에 result 영역 숨기기
    setTimeout(function() {
    document.getElementById("result").innerHTML = "";
    document.getElementById("submitBtn").style.display="block";
  }, 3000);
  })
  .catch(error => {
    console.error("Error!", error);
    document.getElementById("result").innerHTML =
      '<div class="alert alert-danger">⚠데이터 저장에 실패하였습니다.</div>';
  })
  .finally(() => {
    submitButton.disabled = false;
    submitButton.textContent = "📤제출하기";
  });
});
  </script>
</body>
</html>
