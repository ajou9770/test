<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀바탕화면 바로가기 아이콘 생성</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 50px;
        }
        #install-button {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h3 class="text-center">바탕화면에 바로가기 만들기</h3>
        <hr>
        <p class="text-center">아래 사이트를 바탕화면으로 드래그하여 바로가기 아이콘을 만들어 보세요</p>
        <div class="text-center">
            <a href="https://ajou9770.github.io/notice/ETC/appsheet.html" id="shortcut-link" class="btn btn-primary">🖱업무용앱 바로가기</a>
            <br><br>
            <a href="https://ajou9770.github.io/notice/ETC/file_cowork.html" id="shortcut-link" class="btn btn-primary">🖱업무공용파일Up&Down</a>
        </div>
        <div class="text-center mt-3">
            <button id="install-button" class="btn btn-success">앱 설치</button>
        </div>
    </div>

    <script>
        document.getElementById('shortcut-link').addEventListener('click', function(event) {
            event.preventDefault();
            alert("🤷‍♂️업무용 앱페이지를 바탕화면에 드래그 하여 바로가기앱으로 사용하세요");
        });

        // PWA 설치 이벤트
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-button').style.display = 'block';
        });

        document.getElementById('install-button').addEventListener('click', (e) => {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    console.log('User accepted the A2HS prompt');
                } else {
                    console.log('User dismissed the A2HS prompt');
                }
                deferredPrompt = null;
            });
        });
    </script>
</body>
</html>
